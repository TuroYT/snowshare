name: "Auto assign and label issues"

on:
  issues:
    types: [opened]

jobs:
  auto-assign:
    name: Auto assign issue to creator
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Assign issue and add label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            await github.rest.issues.addAssignees({ ...issue, assignees: [context.repo.owner] });
            await github.rest.issues.addLabels({ ...issue, labels: ['needs-review'] });
