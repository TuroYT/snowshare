name: "Auto label pull requests"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  label:
    name: Apply labels
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Run labeler
        uses: actions/labeler@ac9175f8a1f3625fd0d4fb234536d26811351594 # v4.3.0
        with:
          repo-token: ${{ github.token }}
