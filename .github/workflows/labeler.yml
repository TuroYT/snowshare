name: "Auto label pull requests"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  label:
    name: Apply labels
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Run labeler
        uses: actions/labeler@v4
        with:
          repo-token: ${{ github.token }}
